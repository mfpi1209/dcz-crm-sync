name: Deploy EasyPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, push GHCR e deploy EasyPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # EasyPanel puxa sem credencial de registry → pacote precisa ser público
      - name: Tornar pacote GHCR público
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PKG="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "Ajustando visibilidade de ghcr.io/${OWNER}/${PKG} para public..."
          # retry: o pacote às vezes ainda não aparece logo após o push
          for i in 1 2 3 4 5; do
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PKG}/visibility" \
              -f visibility=public; then
              echo "Pacote público."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando..."
            sleep 5
          done
          echo "::warning::Não foi possível tornar o pacote público automaticamente."
          echo "::warning::No GitHub: Packages → dcz-crm-sync → Package settings → Change visibility → Public"
          echo "::warning::Ou cadastre no EasyPanel um PAT com read:packages para ghcr.io."

      - name: Call EasyPanel deploy webhook
        env:
          DEPLOY_HOOK: ${{ secrets.PAINEL_EDUIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::Secret PAINEL_EDUIT_TOKEN não está configurado no repositório."
            exit 1
          fi
          echo "Disparando deploy no EasyPanel..."
          http_code="$(curl -sS -o /tmp/easypanel-deploy-body.txt -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --max-time 60 \
            "$DEPLOY_HOOK")"
          echo "HTTP $http_code"
          if [ -s /tmp/easypanel-deploy-body.txt ]; then
            cat /tmp/easypanel-deploy-body.txt
            echo
          fi
          case "$http_code" in
            2*) echo "Deploy disparado com sucesso." ;;
            *)
              echo "::error::Falha ao disparar deploy (HTTP $http_code)."
              exit 1
              ;;
          esac
