name: Deploy EasyPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, push GHCR e deploy EasyPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GITHUB_TOKEN não consegue mudar visibilidade do pacote.
      # Se existir o secret GHCR_PAT (classic PAT com delete:packages + write:packages
      # ou fine-grained com Admin em packages), tornamos público automaticamente.
      - name: Tornar pacote GHCR público
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "Tentando tornar ghcr.io/${{ github.repository_owner }}/${PKG} público..."
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PKG}/visibility" \
              -f visibility=public 2>/tmp/ghcr-vis.err; then
              echo "Pacote público."
              ok=1
              break
            fi
            echo "Tentativa $i falhou: $(cat /tmp/ghcr-vis.err || true)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Pacote GHCR ainda privado. EasyPanel vai tomar 403 no pull."
            echo "::error::Faça 1x no GitHub: Packages → dcz-crm-sync → Package settings → Change visibility → Public"
            echo "::error::Ou cadastre secret GHCR_PAT (PAT com permissão de admin no package) e rode de novo."
            echo "::error::Link: https://github.com/users/${{ github.repository_owner }}/packages/container/package/${PKG}"
            exit 1
          fi

      - name: Verificar pull anônimo (como o EasyPanel)
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):latest"
          echo "Testando pull anônimo de $IMG ..."
          # token anônimo do GHCR
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):pull" | jq -r .token)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')/manifests/latest")"
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Manifest ainda inacessível anonimamente (HTTP $code). Pacote precisa ser Public."
            exit 1
          fi

      - name: Call EasyPanel deploy webhook
        env:
          DEPLOY_HOOK: ${{ secrets.PAINEL_EDUIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::Secret PAINEL_EDUIT_TOKEN não está configurado no repositório."
            exit 1
          fi
          echo "Disparando deploy no EasyPanel..."
          # EasyPanel rejeita Content-Type application/json com body vazio (HTTP 400).
          http_code="$(curl -sS -o /tmp/easypanel-deploy-body.txt -w '%{http_code}' \
            -X POST \
            --max-time 60 \
            "$DEPLOY_HOOK")"
          echo "HTTP $http_code"
          if [ -s /tmp/easypanel-deploy-body.txt ]; then
            cat /tmp/easypanel-deploy-body.txt
            echo
          fi
          case "$http_code" in
            2*) echo "Deploy disparado com sucesso." ;;
            *)
              echo "::error::Falha ao disparar deploy (HTTP $http_code)."
              exit 1
              ;;
          esac
