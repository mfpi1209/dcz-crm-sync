    <style>
        /* Render guard: até o JS de navegação SPA assumir o controle, o
           servidor já decide qual página deve aparecer no primeiro paint
           (evita flash do "Dashboard Acadêmico" quando o usuário deveria
           ver "Minha Performance", por exemplo). */
        body.initial-bootstrap [id^="page-"]:not(#page-{{ nav_initial_page }}) {
            display: none !important;
        }
        body.initial-bootstrap #page-{{ nav_initial_page }} {
            display: block !important;
        }

        /* Splash de boot — cobre a tela até o JS aplicar a navegação inicial.
           Garante que NUNCA seja exibida outra página (ex.: dashboard global)
           durante o carregamento.
           Animação "X-Opening": 4 obturadores triangulares cobrem a tela em X
           e saem (top↑/bottom↓/left←/right→) revelando o app, com um flash de
           feixes cyan no eixo diagonal. */
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: transparent;
            color: #e2e8f0;
            font-family: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;
            pointer-events: none;
            overflow: hidden;
        }

        /* Obturadores triangulares: cada um cobre um quadrante triangular,
           juntos cobrem a tela inteira. */
        #boot-splash .boot-shutter {
            position: absolute;
            inset: 0;
            background: #050505;
            z-index: 40;
            pointer-events: auto;
            will-change: transform;
            transition: transform 1.2s cubic-bezier(0.82, 0, 0.18, 1) .1s;
        }
        /* Triângulos se sobrepõem 1px no centro para evitar costura diagonal
           visível (o "X" do anti-aliasing quando os clip-paths se tocam
           exatamente em 50% 50%). */
        #boot-splash .boot-shutter--top    { clip-path: polygon(-1px -1px, calc(100% + 1px) -1px, 50% calc(50% + 1px)); }
        #boot-splash .boot-shutter--bottom { clip-path: polygon(-1px calc(100% + 1px), calc(100% + 1px) calc(100% + 1px), 50% calc(50% - 1px)); }
        #boot-splash .boot-shutter--left   { clip-path: polygon(-1px -1px, -1px calc(100% + 1px), calc(50% + 1px) 50%); }
        #boot-splash .boot-shutter--right  { clip-path: polygon(calc(100% + 1px) -1px, calc(100% + 1px) calc(100% + 1px), calc(50% - 1px) 50%); }

        /* Feixes diagonais em X — flashinho cyan no momento da abertura. */
        #boot-splash .boot-beams {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }
        #boot-splash .boot-beam {
            position: absolute;
            left: -25%;
            top: 50%;
            width: 150%;
            height: 1px;
            background: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
        }
        #boot-splash .boot-beam--a { transform: rotate(-45deg); }
        #boot-splash .boot-beam--b { transform: rotate(45deg); }

        /* Marca/spinner ficam por cima dos shutters durante o boot. */
        #boot-splash .boot-brand,
        #boot-splash .boot-sub,
        #boot-splash .boot-spinner {
            position: relative;
            z-index: 45;
            transition: opacity .3s ease;
        }
        #boot-splash .boot-brand {
            font-weight: 800;
            font-size: 1.85rem;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        #boot-splash .boot-brand .accent { color: #74AEE9; }
        #boot-splash .boot-sub {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .28em;
            text-transform: uppercase;
            opacity: .55;
        }
        #boot-splash .boot-spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(148, 163, 184, .25);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: boot-spin .8s linear infinite;
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }

        /* Estado de saída: shutters voam para fora + feixes flashinham. */
        body.splash-exiting #boot-splash .boot-shutter--top    { transform: translateY(-100%); }
        body.splash-exiting #boot-splash .boot-shutter--bottom { transform: translateY(100%); }
        body.splash-exiting #boot-splash .boot-shutter--left   { transform: translateX(-100%); }
        body.splash-exiting #boot-splash .boot-shutter--right  { transform: translateX(100%); }
        body.splash-exiting #boot-splash .boot-beams {
            animation: boot-beam-flash .8s ease-in-out .1s both;
        }
        body.splash-exiting #boot-splash .boot-brand,
        body.splash-exiting #boot-splash .boot-sub,
        body.splash-exiting #boot-splash .boot-spinner {
            opacity: 0;
        }
        @keyframes boot-beam-flash {
            0%   { opacity: 0; }
            50%  { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
    <script>
        /* Aplica o tema persistido o quanto antes para o splash já nascer
           na cor correta (sem flash claro→escuro). */
        (function() {
            try {
                var t = localStorage.getItem('eduit-theme') || 'dark';
                document.documentElement.classList.add(t);
            } catch (e) { document.documentElement.classList.add('dark'); }
        })();
        /* Failsafe: se utils.js não chegar a chamar navigate (erro fatal de
           carregamento), garantimos a remoção do splash (com a mesma
           animação X-Opening). */
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (document.body && document.body.classList.contains('initial-bootstrap')) {
                    document.body.classList.remove('initial-bootstrap');
                    document.body.classList.add('splash-exiting');
                    setTimeout(function() {
                        var sp = document.getElementById('boot-splash');
                        if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
                        document.body.classList.remove('splash-exiting');
                    }, 1350);
                }
            }, 2500);
        });
    </script>

    <style>
        /* ═══════════════════════════════════════════════════════════════
           DESIGN SYSTEM — eduit. v2.0
           Sistema de design unificado e consistente
           ═══════════════════════════════════════════════════════════════ */

        :root {
            /* === Primary (Executive Blue) === */
            --primary-rgb: 0 52 111;             /* #00346f */
            --primary: #00346f;
            --primary-container: #004a99;
            --primary-deep: #002D5E;
            --primary-medium: #4C709A;
            --primary-dark: #002247;
            --primary-light: #e6edf6;

            /* === Secondary (Executive Green) === */
            --secondary: #006c49;
            --secondary-container: #6cf8bb;

            /* === Status === */
            --accent: #f59e0b;
            --success: #006c49;
            --warning: #d97706;
            --danger: #dc2626;

            /* === Surfaces ===
               Claro: cartões nunca #fff puro — alívio visual + hierarquia com o canvas */
            --bg-main: #e4eaf2;
            --bg-card: #f3f6fa;
            --bg-elevated: #eef2f7;
            --bg-overlay: rgba(243, 246, 250, 0.92);
            --surface-variant: #e2e8f0;

            /* === Texto === */
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-disabled: #cbd5e1;

            /* === Bordas === */
            --border: #d1dae6;
            --border-subtle: rgba(209, 218, 230, 0.85);
            --border-hover: #b8c5d4;
            --outline: #737783;

            /* === Sombras (executivas, mais sutis) === */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
            --shadow: 0 1px 3px rgba(15, 23, 42, .07), 0 2px 8px -2px rgba(0, 52, 111, .05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, .09), 0 2px 6px -2px rgba(0, 52, 111, .06);
            --shadow-lg: 0 12px 24px -6px rgba(0, 52, 111, .11), 0 6px 10px -4px rgba(15, 23, 42, .05);
            --shadow-xl: 0 24px 40px -8px rgba(0, 52, 111, .14), 0 10px 14px -6px rgba(15, 23, 42, .06);

            /* === Raios (executivos: cards 2xl/3xl) === */
            --radius-sm: 8px;
            --radius-btn: 10px;
            --radius-card: 20px;
            --radius-xl: 24px;
            --radius-2xl: 28px;

            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark {
            /* Primary executiva clara em dark — azul mais luminoso */
            --primary-rgb: 116 174 233;          /* #74AEE9 */
            --primary: #74AEE9;
            --primary-container: #4C709A;
            --primary-deep: #002D5E;
            --primary-medium: #4C709A;
            --primary-dark: #00346f;
            --primary-light: rgba(116, 174, 233, 0.12);

            --secondary: #6cf8bb;
            --secondary-container: #006c49;

            --bg-main: #0b1623;
            --bg-card: #122033;
            --bg-elevated: #1a2942;
            --bg-overlay: rgba(11, 22, 35, 0.92);
            --surface-variant: rgba(255, 255, 255, 0.04);

            --text-primary: #e6edf6;
            --text-secondary: #9aabc3;
            --text-muted: #6b7d97;
            --text-disabled: #475569;

            --border: rgba(76, 112, 154, 0.25);
            --border-subtle: rgba(76, 112, 154, 0.15);
            --border-hover: rgba(116, 174, 233, 0.45);
            --outline: rgba(154, 171, 195, 0.4);

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);

            --shadow-md: 0 6px 14px -2px rgba(0, 0, 0, .4), 0 2px 4px -2px rgba(0, 0, 0, .25);
            --shadow-lg: 0 14px 28px -6px rgba(0, 0, 0, .5), 0 6px 8px -3px rgba(0, 0, 0, .3);
            --shadow-xl: 0 28px 48px -8px rgba(0, 0, 0, .6), 0 12px 16px -6px rgba(0, 0, 0, .4);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;

        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(0, 52, 111, 0.18); }
        .dark .kpi-card { background: var(--bg-card); border-color: rgba(148,163,184,.10); }
        .dark .kpi-card:hover { border-color: rgba(116, 174, 233, 0.35); }
        .kpi-card.is-primary    { background: linear-gradient(135deg, #00346f 0%, #002046 100%); border-color: transparent; color:#fff; }
        .kpi-card.is-primary:hover { box-shadow: 0 18px 40px -12px rgba(0,52,111,.45); }
        .kpi-card.is-secondary  { background: linear-gradient(135deg, #4C709A 0%, #355476 100%); border-color: transparent; color:#fff; }
        .kpi-card.is-secondary:hover { box-shadow: 0 18px 40px -12px rgba(76,112,154,.45); }

        .kpi-card .kpi-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
        .kpi-card .kpi-title {
            font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
            color: var(--text-muted);
            font-family: var(--font-headline, inherit);
        }
        .kpi-card.is-primary .kpi-title,
        .kpi-card.is-secondary .kpi-title { color: rgba(255,255,255,.72); }

        .kpi-card .kpi-trend {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px; font-weight: 700;
            line-height: 1;
        }
        .kpi-card .kpi-trend.up   { background: rgba(16,185,129,.12); color: rgb(5,150,105); }
        .kpi-card .kpi-trend.down { background: rgba(239,68,68,.12); color: rgb(220,38,38); }
        .kpi-card.is-primary .kpi-trend.up,
        .kpi-card.is-secondary .kpi-trend.up   { background: rgba(74,222,128,.18); color: rgb(74,222,128); }
        .kpi-card.is-primary .kpi-trend.down,
        .kpi-card.is-secondary .kpi-trend.down { background: rgba(248,113,113,.20); color: rgb(252,165,165); }
        .kpi-card .kpi-trend .ms-icon { font-size: 13px; }

        .kpi-card .kpi-value-row { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
        .kpi-card .kpi-value {
            font-size: clamp(1.75rem, 1.5rem + 1vw, 2.25rem);
            font-weight: 800; letter-spacing: -0.025em; line-height: 1;
            font-family: var(--font-display, inherit);
            color: var(--text-primary);
        }
        .kpi-card.is-primary .kpi-value,
        .kpi-card.is-secondary .kpi-value { color: #fff; }
        .kpi-card .kpi-subtitle {
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
            color: var(--text-muted);
        }
        .kpi-card.is-primary .kpi-subtitle,
        .kpi-card.is-secondary .kpi-subtitle { color: rgba(255,255,255,.62); }

        .kpi-card .kpi-spark { height: 36px; }

        /* ═══ Abas segmentadas (padrão cockpit / Arquiteto Executivo) ═══ */
        .ds-segment {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 5px;
            border-radius: 14px;
            background: rgba(0, 52, 111, 0.06);
            border: 1px solid rgba(0, 52, 111, 0.12);
        }
        .dark .ds-segment {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(116, 174, 233, 0.18);
        }
        .ds-segment--compact {
            padding: 4px;
            gap: 3px;
            border-radius: 12px;
        }
        .ds-segment--compact .ds-segment__btn {
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
            border-radius: 9px;
        }
        .ds-segment__btn {
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
        }
        .ds-segment__btn:hover:not(.ds-segment__btn--active) {
            color: var(--primary);
            background: rgba(0, 52, 111, 0.08);
        }
        .dark .ds-segment__btn:hover:not(.ds-segment__btn--active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .ds-segment__btn--active {
            background: var(--primary);
            color: #fff !important;
            box-shadow: 0 1px 3px rgba(0, 52, 111, 0.22);
        }
        .dark .ds-segment__btn--active {
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        }
        .ds-segment__btn--active .material-symbols-outlined {
            color: #fff !important;
        }

        /* KPI secundário — azul médio (mesma família do template executivo) */
        .kpi-tile-medium {
            background: var(--primary-medium);
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 48%);
            color: #fff;
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .topbar-user {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.6rem 0.25rem 0.35rem;
            border-radius: 999px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            max-width: 11rem;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
            font: inherit;
        }
        .topbar-user:hover { border-color: var(--primary); }
        .topbar-user:active { transform: scale(0.98); }
        @media (min-width: 640px) {
            .topbar-user.has-name { display: inline-flex; }
        }
        .topbar-user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'Manrope', 'Inter', sans-serif;
        }
        .dark .topbar-user-avatar {
            background: rgba(116, 174, 233, 0.35);
            color: var(--text-primary);
        }
        .topbar-user-name {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════════════════════════
           COMPONENTES — Sidebar (executivo)
           ═══════════════════════════════════════════════════════════════ */
        .glass-sidebar {
            background: #f1f5f9; /* slate-100 — igual ao template executivo */
            border-right: 1px solid #e2e8f0;
        }
        .dark .glass-sidebar {
            background: #0a1320;
            border-right-color: rgba(76, 112, 154, 0.18);
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            font-family: 'Manrope', 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: all var(--transition-base);
            cursor: pointer;
            color: #1e3a5f;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        /* Spotlight cyan que segue o cursor (controlado por --mx/--my via JS). */
        .sidebar-link::after,
        .sidebar-group-toggle::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s ease;
            background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%),
                                        rgba(34, 211, 238, 0.22),
                                        transparent 70%);
            z-index: 0;
            border-radius: inherit;
        }
        .sidebar-link:hover::after,
        .sidebar-group-toggle:hover::after { opacity: 1; }
        .sidebar-link > *,
        .sidebar-group-toggle > * { position: relative; z-index: 1; }

        .glass-sidebar .sidebar-link .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        .sidebar-link:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.92);
        }

        .sidebar-link.active {
            background: var(--bg-card);
            color: var(--primary);
            font-weight: 700;
            box-shadow: 0 1px 3px rgba(0, 52, 111, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-color: transparent;
            position: relative;
        }
        .sidebar-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--primary);
            border-radius: 0 3px 3px 0;
            animation: slideBarIn 0.2s ease-out;
        }
        @keyframes slideBarIn {
            from { height: 0; opacity: 0; }
            to { height: 60%; opacity: 1; }
        }

        .dark .sidebar-link {
            color: #9aabc3;
        }
        .dark .sidebar-link:hover {
            color: #ffffff;
            background: rgba(116, 174, 233, 0.08);
        }
        .dark .sidebar-link.active {
            background: rgba(116, 174, 233, 0.15);
            color: var(--primary);
            border-color: transparent;
            box-shadow: 0 1px 3px rgba(116, 174, 233, 0.18);
        }

        .sidebar-link .material-symbols-outlined,
        .sidebar-link svg {
            transition: color var(--transition-fast);
            flex-shrink: 0;
        }

        .sidebar-sub {
            padding-left: 1.75rem;
            font-size: 0.7rem;
            margin-left: 0.75rem;
            border-left: 1px solid var(--border);
        }
        .dark .sidebar-sub {
            border-left-color: rgba(76, 112, 154, 0.2);
        }

        .sidebar-section-label {
            font-family: 'Manrope', 'Inter', sans-serif;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #64748b;
            padding: 0 0.75rem;
        }

        .dark .sidebar-section-label {
            color: var(--outline);
        }

        .sidebar-group-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.55rem 0.85rem;
            font-family: 'Manrope', 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #475569;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        .sidebar-group-toggle .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        .sidebar-group-toggle:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.65);
        }
        .dark .sidebar-group-toggle {
            color: #6b7d97;
        }
        .dark .sidebar-group-toggle:hover {
            color: #ffffff;
            background: rgba(116, 174, 233, 0.06);
        }

        .sidebar-group-chevron {
            transition: transform var(--transition-base);
        }
        .sidebar-group.collapsed .sidebar-group-chevron {
            transform: rotate(-90deg);
        }
        .sidebar-group-items {
            margin-top: 2px;
            overflow: hidden;
            max-height: 2000px;
            opacity: 1;
            transition: max-height 0.4s ease, opacity 0.2s ease;
        }
        .sidebar-group.collapsed .sidebar-group-items {
            max-height: 0;
            opacity: 0;
        }

        /* Light mode is the base - no overrides needed */

        /* ═══════════════════════════════════════════════════════════════
           COMPONENTES — Metric / KPI Cards (executivo)
           ═══════════════════════════════════════════════════════════════ */
        .metric-card {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-card);
            padding: 1.5rem;
            background: var(--bg-card);
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 45%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, 0.72);
            transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
        }
        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 52, 111, 0.18);
        }
        .dark .metric-card {
            background: var(--bg-card);
            background-image: none;
            border-color: var(--border);
            box-shadow: var(--shadow);
        }
        .dark .metric-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: rgba(116, 174, 233, 0.35);
        }

        /* Variantes de cor ajustadas para a paleta executiva */
        .metric-indigo  { border-color: rgba(0, 52, 111, 0.25); }
        .metric-primary { border-color: rgba(0, 52, 111, 0.25); }
        .metric-emerald { border-color: rgba(0, 108, 73, 0.30); }
        .metric-amber   { border-color: rgba(217, 119, 6, 0.30); }
        .metric-cyan    { border-color: rgba(76, 112, 154, 0.45); }

        /* Variante "Solid Primary" — card escuro sólido (estilo template) */
        .metric-card-solid {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-xl);
            padding: 2rem;
            background: var(--primary-deep);
            color: #fff;
            border: 1px solid transparent;
            box-shadow: var(--shadow);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }
        .metric-card-solid:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 32px -10px rgba(0, 52, 111, 0.45);
        }
        .metric-card-solid .label-exec {
            color: rgba(190, 210, 235, 0.8);
        }
        .metric-card-solid .metric-value {
            color: #fff;
        }

        /* Variante "Medium Primary" — card azul médio (estilo template) */
        .metric-card-medium {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-xl);
            padding: 2rem;
            background: var(--primary-medium);
            color: #fff;
            border: 1px solid transparent;
            box-shadow: var(--shadow);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }
        .metric-card-medium:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 32px -10px rgba(76, 112, 154, 0.5);
        }
        .metric-card-medium .label-exec {
            color: rgba(220, 232, 248, 0.85);
        }
        .metric-card-medium .metric-value {
            color: #fff;
        }

        /* Valor numérico padrão dos KPIs */
        .metric-value {
            font-family: 'Manrope', 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2.25rem;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: var(--primary-deep);
        }
        .dark .metric-value { color: var(--text-primary); }

        /* Status dot */
        .green-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* ═══════════════════════════════════════════════════════════════
           COMPONENTES — Botões
           ═══════════════════════════════════════════════════════════════ */
        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: var(--radius-btn);
            box-shadow: 0 4px 12px rgba(0, 52, 111, 0.18);
            transition: all var(--transition-base);
            color: white;
            font-weight: 700;
            font-family: 'Manrope', 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }
        .btn-primary:hover {
            background: var(--primary-container);
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(0, 52, 111, 0.28);
        }
        .btn-primary:active { transform: translateY(0); }
        .dark .btn-primary {
            background: var(--primary);
            color: var(--primary-deep);
            box-shadow: 0 4px 14px rgba(116, 174, 233, 0.25);
        }
        .dark .btn-primary:hover {
            background: #9ec6f0;
            box-shadow: 0 6px 20px rgba(116, 174, 233, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: var(--radius-btn);
            box-shadow: 0 4px 14px rgba(239,68,68,0.3);
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        .btn-danger::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(239,68,68,0.4);
            transform: translateY(-2px);
        }
        .btn-danger:hover::before { opacity: 1; }

        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            border-radius: var(--radius-btn);
            box-shadow: 0 4px 14px rgba(5,150,105,0.3);
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        .btn-success::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .btn-success:hover {
            box-shadow: 0 8px 25px rgba(5,150,105,0.4);
            transform: translateY(-2px);
        }
        .btn-success:hover::before { opacity: 1; }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: var(--radius-btn);
            box-shadow: 0 4px 14px rgba(245,158,11,0.3);
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        .btn-warning::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .btn-warning:hover {
            box-shadow: 0 8px 25px rgba(245,158,11,0.4);
            transform: translateY(-2px);
        }
        .btn-warning:hover::before { opacity: 1; }

        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #334155;
            border-radius: var(--radius-btn);
            transition: all var(--transition-base);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }
        .dark .btn-secondary {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(51, 65, 85, 0.5);
            color: #e2e8f0;
        }
        .dark .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.6);
        }

        /* ═══════════════════════════════════════════════════════════════
           COMPONENTES — Inputs
           ═══════════════════════════════════════════════════════════════ */
        .input-glass {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #1e293b;
            transition: all var(--transition-base);
        }
        .input-glass::placeholder { color: #94a3b8; }
        .input-glass:hover { border-color: #cbd5e1; }
        .input-glass:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
            outline: none;
        }
        .dark .input-glass {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(71, 85, 105, 0.5);
            color: #f8fafc;
        }
        .dark .input-glass::placeholder { color: #64748b; }
        .dark .input-glass:hover { border-color: #475569; }
        .dark .input-glass:focus {
            border-color: rgb(var(--primary-rgb));
            box-shadow: 0 0 0 3px rgb(var(--primary-rgb) / 0.2);
        }

        /* Listas nativas do <select>: contraste no painel claro */
        select.input-glass option,
        select.input-glass optgroup {
            color: #0f172a;
            background: #ffffff;
        }
        .dark select.input-glass option,
        .dark select.input-glass optgroup {
            color: #e2e8f0;
            background: #1e293b;
        }

        /* ═══════════════════════════════════════════════════════════════
           COMPONENTES — Permission Picker (modal de usuario)
           ═══════════════════════════════════════════════════════════════ */
        .perm-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.85rem;
            padding: 0.65rem;
            border-radius: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
        }
        .dark .perm-toolbar {
            background: rgba(30, 41, 59, 0.35);
            border-color: rgba(76, 112, 154, 0.18);
        }
        .perm-toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .perm-toolbar-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }
        .perm-toolbar-btn.primary {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
        }
        .perm-toolbar-btn.primary:hover {
            background: var(--primary-container);
            border-color: var(--primary-container);
            color: white;
        }
        .dark .perm-toolbar-btn {
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.55);
            border-color: rgba(76, 112, 154, 0.25);
        }
        .dark .perm-toolbar-btn:hover {
            color: #f8fafc;
            border-color: rgba(116, 174, 233, 0.45);
        }
        .dark .perm-toolbar-btn.primary {
            color: var(--primary-deep);
            background: var(--primary);
            border-color: var(--primary);
        }
        .dark .perm-toolbar-btn.primary:hover {
            background: #9ec6f0;
            border-color: #9ec6f0;
        }

        .perm-group-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;

    <script>
        (function() {
            // Default global = dark. Migration v2: reseta uma vez quem tinha light salvo
            // de versoes anteriores, restaurando o tema escuro como padrao oficial.
            try {
                if (!localStorage.getItem('eduit-theme-default-v2')) {
                    localStorage.removeItem('eduit-theme');
                    localStorage.setItem('eduit-theme-default-v2', '1');
                }
            } catch (_) {}
            var t = localStorage.getItem('eduit-theme') || 'dark';
            document.documentElement.classList.add(t);
        })();
    </script>
