<div id="page-chamados_ti" class="hidden flex-1 flex flex-col min-w-0">

    <header class="glass-card border border-[var(--border)] rounded-2xl px-4 lg:px-8 py-6 mx-4 lg:mx-8 mt-4 mb-6">
        <div class="flex items-center justify-between gap-4 flex-wrap">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm shrink-0"
                     style="background: var(--primary)">
                    <span class="material-symbols-outlined text-[22px]">assignment</span>
                </div>
                <div class="min-w-0">
                    <h2 class="text-2xl font-black text-[var(--text-primary)] dark:text-white truncate">Fila de chamados</h2>
                    <p id="cti-sub" class="text-xs text-slate-600 dark:text-slate-400 mt-1 uppercase tracking-widest">Altere o status conforme o andamento</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 px-4 lg:px-8 pb-8 space-y-5">
        <!-- Departamentos que o usuário pode operar (montado pelo JS; some
             quando ele só tem acesso a uma fila). -->
        <div class="flex flex-wrap items-center justify-between gap-2">
            <div id="cti-depto-wrap" class="hidden flex flex-wrap gap-1 p-1 rounded-xl w-fit" style="background: var(--bg-elevated);">
                <div id="cti-depto-tabs" class="flex flex-wrap gap-1"></div>
            </div>
            <div id="cti-view-seg" class="ds-segment ds-segment--compact ml-auto" role="group" aria-label="Visualização">
                <button type="button" data-view="lista" class="cti-view-btn ds-segment__btn inline-flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px]">view_list</span>Lista
                </button>
                <button type="button" data-view="kanban" class="cti-view-btn ds-segment__btn inline-flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px]">view_kanban</span>Kanban
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-3">
            <button type="button" onclick="ctiSetStatus('Novo Ticket')" class="glass-card border border-[var(--border)] rounded-xl p-4 text-left hover:border-[var(--primary)]">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Novo ticket</p>
                <p id="cti-kpi-novo" class="text-2xl font-black mt-1" style="color: #60a5fa;">0</p>
            </button>
            <button type="button" onclick="ctiSetStatus('A Fazer')" class="glass-card border border-[var(--border)] rounded-xl p-4 text-left hover:border-[var(--primary)]">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">A fazer</p>
                <p id="cti-kpi-fazer" class="text-2xl font-black mt-1" style="color: #34d399;">0</p>
            </button>
            <button type="button" onclick="ctiSetStatus('Em Produção')" class="glass-card border border-[var(--border)] rounded-xl p-4 text-left hover:border-[var(--primary)]">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Em produção</p>
                <p id="cti-kpi-prod" class="text-2xl font-black mt-1" style="color: #a78bfa;">0</p>
            </button>
            <button type="button" onclick="ctiSetStatus('Pausado')" class="glass-card border border-[var(--border)] rounded-xl p-4 text-left hover:border-[var(--primary)]">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Pausado</p>
                <p id="cti-kpi-pausado" class="text-2xl font-black mt-1" style="color: #fb923c;">0</p>
            </button>
            <button type="button" onclick="ctiSetStatus('Concluído')" class="glass-card border border-[var(--border)] rounded-xl p-4 text-left hover:border-[var(--primary)]">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Concluídos</p>
                <p id="cti-kpi-concluido" class="text-2xl font-black mt-1" style="color: #2dd4bf;">0</p>
            </button>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <div id="cti-tabs" class="flex flex-wrap gap-1 p-1 rounded-xl" style="background: var(--bg-elevated);">
                <button type="button" data-status="abertos" class="cti-tab is-active px-3 py-1.5 text-[11px] font-bold rounded-lg">Abertos</button>
                <button type="button" data-status="" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Todos</button>
                <button type="button" data-status="Novo Ticket" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Novo ticket</button>
                <button type="button" data-status="A Fazer" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">A fazer</button>
                <button type="button" data-status="Em Produção" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Em produção</button>
                <button type="button" data-status="Pausado" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Pausado</button>
                <button type="button" data-status="Concluído" class="cti-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Concluídos</button>
            </div>
            <select id="cti-urgencia" class="input-glass cti-ctrl rounded-lg text-sm">
                <option value="">Prioridade</option>
                <option>Baixa</option>
                <option>Média</option>
                <option>Alta</option>
                <option>Crítica</option>
            </select>
            <select id="cti-setor" class="input-glass cti-ctrl rounded-lg text-sm">
                <option value="">Setor</option>
                <option>Marketing</option>
                <option>Comercial</option>
                <option>Acadêmico</option>
                <option>TI</option>
                <option>Financeiro</option>
            </select>
            <select id="cti-categoria" class="input-glass cti-ctrl rounded-lg text-sm">
                <option value="">Tipo / formato</option>
            </select>
            <input type="search" id="cti-q" placeholder="Buscar protocolo, título ou solicitante…"
                   class="input-glass cti-ctrl rounded-lg text-sm flex-1 min-w-[200px]">
        </div>

        <div id="cti-empty" class="hidden glass-card border border-[var(--border)] rounded-2xl p-10 text-center text-slate-500">
            <span class="material-symbols-outlined text-[36px] mb-2">task_alt</span>
            <p class="text-sm">Nenhum chamado neste filtro.</p>
        </div>
        <!-- Kanban: uma coluna por status. Abertos mostra as 4 fases abertas;
             Todos mostra as 5. Um chip só deixa uma coluna. -->
        <p id="cti-kb-hint" class="hidden text-[11px] text-slate-500">
            <span class="material-symbols-outlined text-[13px] align-[-2px]">info</span>
            Filtro de status com uma coluna só — escolha “Abertos” ou “Todos” para arrastar entre colunas.
        </p>
        <div id="cti-kanban" class="hidden"></div>

        <div id="cti-list-wrap" class="glass-card border border-[var(--border)] rounded-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[1080px]">
                    <thead>
                        <tr class="text-[10px] uppercase tracking-wider text-slate-500 border-b border-[var(--border)]">
                            <th class="px-4 py-3">Protocolo</th>
                            <th class="px-4 py-3">Depto</th>
                            <th class="px-4 py-3">Título</th>
                            <th class="px-4 py-3">Solicitante</th>
                            <th class="px-4 py-3">Setor</th>
                            <th class="px-4 py-3">Prioridade</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3">Responsável</th>
                            <th class="px-4 py-3">Aberto em</th>
                            <th class="px-4 py-3 pr-6"></th>
                        </tr>
                    </thead>
                    <tbody id="cti-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="cti-modal" data-dcz-modal-root
         class="hidden fixed inset-0 z-[80] flex items-start justify-center p-4 overflow-y-auto"
         style="background: rgba(15,23,42,.55); backdrop-filter: blur(4px);">
        <div class="sti-ticket-card glass-card border border-[var(--border)] rounded-2xl w-full max-w-2xl my-auto">
            <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-[var(--border)] shrink-0">
                <div class="min-w-0">
                    <div id="cti-modal-chips" class="flex flex-wrap items-center gap-1.5"></div>
                    <h3 id="cti-modal-title" class="text-lg font-bold text-[var(--text-primary)] mt-2 break-words"></h3>
                    <p id="cti-modal-meta" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <button type="button" onclick="ctiCloseModal()" class="p-1 rounded-lg hover:bg-[var(--bg-elevated)] shrink-0"
                        aria-label="Fechar">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="cti-modal-body" class="px-5 py-4 space-y-4 text-sm"></div>
            <div class="px-5 py-4 border-t border-[var(--border)] space-y-3 shrink-0" style="background: var(--bg-elevated);">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <p id="cti-resp-txt" class="text-xs text-slate-500"></p>
                    <div class="flex gap-2">
                        <button type="button" id="cti-assumir" onclick="ctiAssumir()"
                                class="hidden px-3 h-9 rounded-lg text-xs font-bold text-white"
                                style="background: var(--primary);">Puxar chamado</button>
                        <button type="button" id="cti-liberar" onclick="ctiLiberar()"
                                class="hidden px-3 h-9 rounded-lg text-xs font-bold border border-[var(--border)]"
                                style="color: var(--text-secondary);">Devolver à fila</button>
                    </div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex gap-2">
                        <button type="button" id="cti-copiar" onclick="ctiCopiar()"
                                class="px-3 h-10 rounded-xl text-xs font-bold border border-[var(--border)]"
                                style="color: var(--text-secondary);">Copiar</button>
                        <button type="button" id="cti-excluir" onclick="ctiExcluir()"
                                class="hidden px-3 h-10 rounded-xl text-xs font-bold border border-red-500/40 text-red-300">Excluir</button>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="ctiCloseModal()"
                                class="px-3 h-10 rounded-xl text-xs font-bold border border-[var(--border)]"
                                style="color: var(--text-secondary);">Cancelar</button>
                        <button type="button" id="cti-save-status" onclick="ctiSaveStatus()"
                                class="px-4 h-10 rounded-xl text-white text-xs font-bold"
                                style="background: var(--primary);">Salvar alterações</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #page-chamados_ti .cti-tab,
    #page-chamados_ti .cti-dep-tab { color: var(--text-secondary); }
    #page-chamados_ti .cti-tab.is-active,
    #page-chamados_ti .cti-dep-tab.is-active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    #page-chamados_ti .cti-dep-tab { padding: 6px 14px; font-size: 11px; font-weight: 700; border-radius: 8px; }
    #page-chamados_ti .sti-badge,
    #cti-modal .sti-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; white-space: nowrap; }
    #page-chamados_ti .sti-st-novo,
    #cti-modal .sti-st-novo { background: rgba(96,165,250,0.14); color: #60a5fa; }
    #page-chamados_ti .sti-st-fazer,
    #cti-modal .sti-st-fazer { background: rgba(52,211,153,0.14); color: #34d399; }
    #page-chamados_ti .sti-st-prod,
    #cti-modal .sti-st-prod { background: rgba(167,139,250,0.16); color: #a78bfa; }
    #page-chamados_ti .sti-st-pausado,
    #cti-modal .sti-st-pausado { background: rgba(251,146,60,0.16); color: #fb923c; }
    #page-chamados_ti .sti-st-Concluído,
    #cti-modal .sti-st-Concluído { background: rgba(45,212,191,0.14); color: #2dd4bf; }
    #page-chamados_ti .sti-badge-Baixa,
    #cti-modal .sti-badge-Baixa { background: rgba(100,116,139,0.10); color: #475569; }
    #page-chamados_ti .sti-badge-Média,
    #cti-modal .sti-badge-Média { background: rgba(59,130,246,0.12); color: #1d4ed8; }
    #page-chamados_ti .sti-badge-Alta,
    #cti-modal .sti-badge-Alta { background: rgba(245,158,11,0.12); color: #b45309; }
    #page-chamados_ti .sti-badge-Crítica,
    #cti-modal .sti-badge-Crítica { background: rgba(239,68,68,0.12); color: #b91c1c; }
    #page-chamados_ti .cti-livre { background: rgba(100,116,139,0.12); color: #475569; }
    #page-chamados_ti .cti-st-btn,
    #cti-modal .cti-st-btn { background: var(--bg-card); border-color: var(--border); color: var(--text-secondary); }
    #page-chamados_ti .cti-st-btn.is-active,
    #cti-modal .cti-st-btn.is-active { border-color: var(--primary); color: var(--primary); }
    #page-chamados_ti tbody tr:hover { background: var(--bg-elevated); }

    /* Quadro no visual do projeto de briefing: fundo claro e card pastel por formato. */
    #cti-kanban {
        display: flex; gap: 16px; align-items: stretch; overflow-x: auto;
        background: #f8fafc; border-radius: 20px; padding: 16px 12px 20px;
    }
    #cti-kanban.hidden { display: none; }
    #page-chamados_ti .cti-kb-col {
        flex: 1 1 0; min-width: 272px; display: flex; flex-direction: column; background: transparent; border: 0;
    }
    #page-chamados_ti .cti-kb-col.is-over .cti-kb-body { outline: 2px solid #a5b4fc; border-radius: 16px; background: rgba(99,102,241,.08); }
    #page-chamados_ti .cti-kb-head {
        display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px;
    }
    #page-chamados_ti .cti-kb-col-name { font-size: 12px; font-weight: 800; color: #1e293b; }
    #page-chamados_ti .cti-kb-caret { color: #94a3b8; font-size: 10px; margin-right: 2px; }
    #page-chamados_ti .cti-kb-col-n { font-size: 11px; font-weight: 700; color: #94a3b8; }
    #page-chamados_ti .cti-col-add {
        width: 22px; height: 22px; border-radius: 6px; color: #94a3b8; font-size: 16px; line-height: 1;
    }
    #page-chamados_ti .cti-col-add:hover { background: #e2e8f0; color: #334155; }
    #page-chamados_ti .cti-kb-body {
        display: flex; flex-direction: column; gap: 12px; min-height: 180px;
        max-height: calc(100dvh - 22rem); overflow-y: auto; padding-right: 2px;
    }
    #page-chamados_ti .cti-kb-empty {
        text-align: center; padding: 40px 12px; border: 1px dashed #e2e8f0; border-radius: 16px;
        background: rgba(248,250,252,.7); color: #94a3b8; font-size: 11px; font-weight: 700;
    }
    #page-chamados_ti .cti-kb-card {
        border-radius: 20px; padding: 16px; text-align: left; width: 100%;
        display: flex; flex-direction: column; gap: 10px; border: 1px solid transparent;
        box-shadow: 0 1px 2px rgba(15,23,42,.04);
        transition: box-shadow .15s ease, transform .15s ease;
    }
    #page-chamados_ti .cti-kb-card:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(15,23,42,.08); }
    #page-chamados_ti .cti-kb-card[draggable="true"] { cursor: grab; }
    #page-chamados_ti .cti-kb-card.is-dragging { opacity: .45; }
    #page-chamados_ti .cti-kb-card.is-saving { opacity: .6; pointer-events: none; }
    #page-chamados_ti .cti-kb-card[data-theme="imagem"] { background: #edf4ff; border-color: #d4e4fc; }
    #page-chamados_ti .cti-kb-card[data-theme="video"] { background: #f5eeff; border-color: #eadcfc; }
    #page-chamados_ti .cti-kb-card[data-theme="ux"] { background: #eef8f2; border-color: #d2f0dc; }
    #page-chamados_ti .cti-kb-card[data-theme="ebook"] { background: #e8f7fa; border-color: #c8edf3; }
    #page-chamados_ti .cti-kb-card[data-theme="brinde"] { background: #fdf7e3; border-color: #fbe8a8; }
    #page-chamados_ti .cti-kb-card[data-theme="outro"] { background: #f3f4fa; border-color: #dce1f2; }
    #page-chamados_ti .cti-kb-card[data-theme="imagem"] .cti-dot.on { background: #3b82f6; }
    #page-chamados_ti .cti-kb-card[data-theme="video"] .cti-dot.on { background: #a855f7; }
    #page-chamados_ti .cti-kb-card[data-theme="ux"] .cti-dot.on { background: #10b981; }
    #page-chamados_ti .cti-kb-card[data-theme="ebook"] .cti-dot.on { background: #06b6d4; }
    #page-chamados_ti .cti-kb-card[data-theme="brinde"] .cti-dot.on { background: #eab308; }
    #page-chamados_ti .cti-kb-card[data-theme="outro"] .cti-dot.on { background: #6366f1; }
    #page-chamados_ti .cti-kb-top { display: flex; align-items: center; justify-content: space-between; }
    #page-chamados_ti .cti-kb-tag {
        font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 8px;
        background: rgba(255,255,255,.85); border: 1px solid rgba(0,0,0,.06); color: #334155;
        text-transform: capitalize;
    }
    #page-chamados_ti .cti-kb-title { font-size: 13px; font-weight: 800; color: #0f172a; line-height: 1.35; }
    #page-chamados_ti .cti-kb-note {
        font-size: 11px; color: #64748b; line-height: 1.45;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #page-chamados_ti .cti-kb-note strong { color: #475569; font-weight: 700; }
    #page-chamados_ti .cti-kb-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    #page-chamados_ti .cti-kb-checks li { font-size: 11px; font-weight: 600; color: #475569; padding-left: 16px; position: relative; }
    #page-chamados_ti .cti-kb-checks li::before {
        content: ''; position: absolute; left: 0; top: 3px; width: 10px; height: 10px; border-radius: 999px; border: 1.5px solid #94a3b8;
    }
    #page-chamados_ti .cti-kb-more { font-size: 10px; color: #94a3b8; padding-left: 16px; }
    #page-chamados_ti .cti-kb-done { font-size: 11px; font-weight: 700; color: #059669; }
    #page-chamados_ti .cti-kb-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: #64748b; }
    #page-chamados_ti .cti-kb-prog-row { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; }
    #page-chamados_ti .cti-kb-prog-row strong { color: #334155; }
    #page-chamados_ti .cti-kb-dots { display: flex; gap: 4px; }
    #page-chamados_ti .cti-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(148,163,184,.45); }
    #page-chamados_ti .cti-kb-foot {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding-top: 8px; border-top: 1px solid rgba(0,0,0,.06);
    }
    #page-chamados_ti .cti-kb-who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    #page-chamados_ti .cti-kb-who-name { font-size: 10px; font-weight: 700; color: #475569; }
    #page-chamados_ti .cti-kb-ava {
        width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
        background: #fff; color: #334155; font-size: 9px; font-weight: 800; border: 1px solid rgba(0,0,0,.06);
    }
    #page-chamados_ti .cti-kb-count { font-size: 11px; font-weight: 700; color: #64748b; }
    #page-chamados_ti .cti-prazo, #cti-modal .cti-prazo {
        font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; white-space: nowrap;
        display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent;
    }
    #page-chamados_ti .cti-prazo-late, #cti-modal .cti-prazo-late { background: #fff1f2; color: #be123c; border-color: #fecdd3; }
    #page-chamados_ti .cti-prazo-soon, #cti-modal .cti-prazo-soon { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    #page-chamados_ti .cti-prazo-ok, #cti-modal .cti-prazo-ok { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
    #page-chamados_ti .cti-prazo-done, #cti-modal .cti-prazo-done { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    #cti-modal .cti-kb-prog { height: 6px; border-radius: 9999px; background: rgba(148,163,184,.25); overflow: hidden; }
    #cti-modal .cti-kb-prog > span { display: block; height: 100%; background: #34d399; }
    #cti-modal .cti-sheet { color: #0f172a; border-radius: 24px; }
    #cti-modal .cti-sheet[data-theme="imagem"] { background: #edf4ff; border-color: #d4e4fc; }
    #cti-modal .cti-sheet[data-theme="video"] { background: #f5eeff; border-color: #eadcfc; }
    #cti-modal .cti-sheet[data-theme="ux"] { background: #eef8f2; border-color: #d2f0dc; }
    #cti-modal .cti-sheet[data-theme="ebook"] { background: #e8f7fa; border-color: #c8edf3; }
    #cti-modal .cti-sheet[data-theme="brinde"] { background: #fdf7e3; border-color: #fbe8a8; }
    #cti-modal .cti-sheet[data-theme="outro"] { background: #f3f4fa; border-color: #dce1f2; }
    #cti-modal .cti-sheet h3,
