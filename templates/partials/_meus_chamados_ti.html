<div id="page-meus_chamados_ti" class="hidden flex-1 flex flex-col min-w-0">

    <header class="glass-card border border-[var(--border)] rounded-2xl px-4 lg:px-8 py-6 mx-4 lg:mx-8 mt-4 mb-6">
        <div class="flex items-center justify-between gap-4 flex-wrap">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm shrink-0"
                     style="background: var(--primary)">
                    <span class="material-symbols-outlined text-[22px]">confirmation_number</span>
                </div>
                <div class="min-w-0">
                    <h2 class="text-2xl font-black text-[var(--text-primary)] dark:text-white truncate">Meus chamados</h2>
                    <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 uppercase tracking-widest">Acompanhe o status das solicitações que você abriu</p>
                </div>
            </div>
            <button type="button" onclick="navigate('solicitacoes_ti')"
                    class="px-4 h-10 rounded-xl text-white text-xs font-bold tracking-wide"
                    style="background: var(--primary);">
                Abrir novo chamado
            </button>
        </div>
    </header>

    <main class="flex-1 px-4 lg:px-8 pb-8 space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="glass-card border border-[var(--border)] rounded-xl p-4">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Pendentes</p>
                <p id="mct-kpi-pendente" class="text-2xl font-black mt-1" style="color: #b45309;">0</p>
            </div>
            <div class="glass-card border border-[var(--border)] rounded-xl p-4">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Em andamento</p>
                <p id="mct-kpi-andamento" class="text-2xl font-black mt-1" style="color: #1d4ed8;">0</p>
            </div>
            <div class="glass-card border border-[var(--border)] rounded-xl p-4">
                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Concluídos</p>
                <p id="mct-kpi-concluido" class="text-2xl font-black mt-1" style="color: #059669;">0</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <div id="mct-tabs" class="flex gap-1 p-1 rounded-xl" style="background: var(--bg-elevated);">
                <button type="button" data-status="abertos" class="mct-tab is-active px-3 py-1.5 text-[11px] font-bold rounded-lg">Abertos</button>
                <button type="button" data-status="" class="mct-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Todos</button>
                <button type="button" data-status="Concluído" class="mct-tab px-3 py-1.5 text-[11px] font-bold rounded-lg">Concluídos</button>
            </div>
            <input type="search" id="mct-q" placeholder="Buscar protocolo ou título…"
                   class="input-glass h-9 px-3 rounded-lg text-sm flex-1 min-w-[180px]">
        </div>

        <div id="mct-empty" class="hidden glass-card border border-[var(--border)] rounded-2xl p-10 text-center text-slate-500">
            <span class="material-symbols-outlined text-[36px] mb-2">inbox</span>
            <p class="text-sm">Nenhum chamado neste filtro.</p>
        </div>
        <div id="mct-list" class="space-y-2.5"></div>
    </main>

    <div id="mct-modal" class="hidden fixed inset-0 z-[80] flex items-start justify-center p-4 overflow-y-auto"
         style="background: rgba(15,23,42,.55); backdrop-filter: blur(4px);">
        <div class="glass-card border border-[var(--border)] rounded-2xl w-full max-w-2xl my-8 overflow-hidden">
            <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-[var(--border)]">
                <div>
                    <p id="mct-modal-proto" class="font-mono text-xs font-bold" style="color: var(--primary);"></p>
                    <h3 id="mct-modal-title" class="text-lg font-bold text-[var(--text-primary)] mt-1"></h3>
                </div>
                <button type="button" onclick="mctCloseModal()" class="p-1 rounded-lg hover:bg-[var(--bg-elevated)]">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="mct-modal-body" class="px-5 py-4 space-y-4 text-sm"></div>
        </div>
    </div>
</div>
