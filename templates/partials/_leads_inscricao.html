<div id="page-leads_inscricao" class="hidden">
    <div class="px-4 md:px-8 py-6 md:py-8 space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-[var(--primary)]">Ferramentas</p>
                <h2 class="text-2xl md:text-3xl font-headline font-extrabold text-[var(--text-primary)] mt-1">
                    Leads em Inscrição Automática
                </h2>
                <p class="text-sm text-[var(--text-secondary)] mt-1.5">
                    Selecione seu nome para listar os leads que estão atualmente em inscrição automática.
                </p>
            </div>
            <button id="li-refresh"
                    type="button"
                    onclick="loadLeadsInscricao(true)"
                    class="btn-secondary text-xs font-semibold px-4 py-2 rounded-xl flex items-center gap-2 self-start md:self-auto">
                <span class="material-symbols-outlined text-[16px]">refresh</span>
                Atualizar lista
            </button>
        </div>

        <!-- Card de seleção -->
        <div class="glass-card p-5 md:p-6">
            <div class="flex flex-col md:flex-row md:items-end gap-4">
                <div class="flex-1">
                    <label for="li-consultor"
                           class="block text-xs font-semibold mb-1.5 text-[var(--text-secondary)] tracking-wide">
                        Selecione seu nome
                    </label>
                    <select id="li-consultor"
                            class="input-glass px-3 py-2.5 text-sm w-full md:max-w-sm">
                        <option value="">— Selecione —</option>
                    </select>
                </div>
                <button id="li-listar"
                        type="button"
                        onclick="listarLeadsInscricao()"
                        class="btn-primary text-sm font-semibold px-6 py-2.5 rounded-xl flex items-center justify-center gap-2 min-w-[180px]">
                    <span id="li-listar-icon" class="material-symbols-outlined text-[18px]">search</span>
                    <span id="li-listar-label">Listar leads</span>
                </button>
            </div>

            <!-- Mensagem de status -->
            <div id="li-status"
                 class="hidden mt-4 px-4 py-3 text-sm rounded-lg"
                 style="background: var(--bg-elevated); border-left: 4px solid var(--primary); color: var(--text-secondary);"></div>
        </div>

        <!-- Resultado -->
        <div id="li-result" class="hidden">
            <div class="glass-card p-0 overflow-hidden">
                <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between gap-3">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-[var(--primary)]">Resultado</p>
                        <h3 class="text-base md:text-lg font-headline font-bold text-[var(--text-primary)] mt-0.5">
                            Leads do consultor
                        </h3>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-[var(--text-muted)]">
                        <span id="li-meta-bruto"></span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead style="background: var(--bg-elevated);">
                            <tr class="text-[10px] uppercase tracking-wider text-[var(--text-muted)]">
                                <th class="px-5 py-3 text-left font-semibold">Consultor</th>
                                <th class="px-5 py-3 text-left font-semibold">Status</th>
                                <th class="px-5 py-3 text-left font-semibold">Qtd. leads</th>
                                <th class="px-5 py-3 text-left font-semibold">ID(s) do lead</th>
                            </tr>
                        </thead>
                        <tbody id="li-tbody" class="text-[var(--text-secondary)]">
                            <!-- preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
